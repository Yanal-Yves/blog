name: Deploy to GitHub Pages

on:
  # Push de contenu : on déploie directement (l'image blog-ci ne change pas).
  # On IGNORE les changements de Dockerfile ici pour ne pas déployer avant que
  # la nouvelle image soit publiée (sinon course → site bâti avec l'ancien Hugo).
  push:
    branches:
      - main
    paths-ignore:
      - "Dockerfile"
      - ".github/workflows/image.yml"
  # Changement de Dockerfile : on déploie APRÈS que "Build & push images" a fini,
  # pour bâtir le site avec l'image fraîchement publiée.
  workflow_run:
    workflows: ["Build & push images"]
    types: [completed]

permissions:
  contents: write
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sur push : toujours. Sur workflow_run : seulement si le build d'image a réussi.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6
        with:
          submodules: true # Important pour télécharger le thème
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Garde-fou : refuse tout chemin non-ASCII sous content/ (cf. CLAUDE.md).
      # Avec enableGitInfo, Hugo apparie chaque fichier à son commit via `git log`,
      # dont le défaut core.quotepath=true échappe les chemins accentués
      # (content/auto-h\303\251bergement/…) : Hugo ne les retrouve plus, n'obtient
      # aucune date et le footer affiche "1 janvier 1" (date zéro de Go). On fait
      # donc PLANTER le build plutôt que de déployer un site à la date erronée.
      # -P : classe POSIX \P{ASCII} = tout octet non-ASCII.
      - name: Vérifie l'absence de chemins non-ASCII sous content/
        run: |
          bad=$(git -c core.quotepath=false ls-files 'content/' 'content.en/' \
                | grep -nP '[^\x00-\x7F]' || true)
          if [ -n "$bad" ]; then
            echo "::error::Chemins non-ASCII interdits sous content/ (voir CLAUDE.md) :"
            echo "$bad"
            exit 1
          fi

      # On construit le site DANS l'image CI (Hugo figé à la même version qu'en
      # local) → build reproductible, fini les écarts de version. Image légère :
      # elle ne contient que Hugo, pas les outils de dev (Claude, gh, nvim).
      # --user : on tourne sous l'utilisateur du runner (pas root) pour que les
      # fichiers générés dans ./public lui appartiennent, et non à root.
      # Chemin : même convention que l'hôte et le conteneur dev — projet sous le
      # home de l'environnement courant, suffixé par `_gh/<org>/<repo>`. Sur le
      # runner, $HOME = /home/runner → /home/runner/_gh/Yanal-Yves/blog. Hugo y
      # écrit `public/`, remappé sur $PWD/public côté runner (publié plus bas).
      - name: Construction du site (Build)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:$HOME/_gh/Yanal-Yves/blog" -w "$HOME/_gh/Yanal-Yves/blog" \
            ghcr.io/yanal-yves/blog-ci:latest \
            hugo --minify

      - name: Déploiement sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: yanal.fargialla.com
