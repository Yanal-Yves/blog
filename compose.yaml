# Environnement de dev isolé pour le blog.
#
# Usage courant :
#   docker compose up dev            # serveur Hugo live-reload sur http://localhost:1313
#   docker compose exec dev bash     # shell DANS le conteneur (claude, nvim, gh, git)
#
# Sécurité : on ne monte que le projet (en lecture/écriture) et le dossier des
# captures d'écran (en LECTURE SEULE) — jamais le $HOME ni le ~/.ssh de l'hôte.
# L'accès GitHub est borné au seul repo Yanal-Yves/blog, par DEUX voies au choix
# (voir CONTAINER.md) :
#   - HTTPS : token fine-grained limité au repo (défaut, sans réglage) ;
#   - SSH   : deploy key DÉDIÉE au repo (jamais ta clé perso), montée en lecture
#             seule. Activée seulement si DEPLOY_KEY est renseigné dans .env.
# Les dégâts que Claude peut faire restent donc bornés à ce projet et à ce repo.

services:
  dev:
    # En local on construit l'étage "dev" du Dockerfile (Hugo + Claude + gh + nvim).
    # `image:` permet aussi de récupérer l'image publiée sur ghcr.io
    # (docker compose pull) au lieu de reconstruire.
    build:
      context: .
      target: dev
      # Aligne l'utilisateur du conteneur sur l'hôte (portabilité Linux uid ≠ 1000).
      # Défaut 1000 si non défini. Sur un hôte concerné, renseigne UID/GID dans .env :
      #   printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" >> .env
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        # Version de Claude Code. Défaut `latest` : chaque `docker compose build`
        # installe la dernière version publiée (cache-busté côté Dockerfile via un
        # ADD du manifeste npm — rien à passer). Pour épingler ponctuellement une
        # version, renseigne CLAUDE_CODE_VERSION dans .env (ou en variable).
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    image: ghcr.io/yanal-yves/blog-dev:latest
    init: true
    stdin_open: true
    tty: true
    ports:
      - "1313:1313"
    # Convention de chemin : le projet vit sous le home de CHAQUE environnement,
    # suffixé par `_gh/<org>/<repo>` (ici Yanal-Yves/blog). Dans le conteneur,
    # l'utilisateur est `node` → `/home/node/_gh/Yanal-Yves/blog`. C'est un user
    # de conteneur générique : aucun chemin perso de l'hôte n'est inscrit ici.
    # (`node` calque ce que tu as sur l'hôte sous `~/_gh/Yanal-Yves/blog`.)
    working_dir: /home/node/_gh/Yanal-Yves/blog
    volumes:
      # On NE monte QUE le projet — jamais $HOME, ~/.ssh, etc. La source `.` est
      # le dépôt courant ; la cible suit la convention ci-dessus.
      - .:/home/node/_gh/Yanal-Yves/blog
      # Config Claude isolée et persistante, séparée de ton ~/.claude de l'hôte.
      # Avec CLAUDE_CONFIG_DIR (voir environment), ce volume contient TOUT l'état
      # de Claude — login, .claude.json, historique des conversations (projects/)
      # — donc plus de ré-authentification ni d'historique perdu à chaque recréation.
      - claude-config:/home/node/.claude
      # Captures d'écran de l'hôte, en LECTURE SEULE (:ro) : Claude n'a qu'à les
      # voir, jamais à y écrire. Montées au même chemin que sur l'hôte.
      # Défaut = dossier KDE/anglais ~/Pictures/Screenshots. Pour une autre locale
      # (FR : ~/Images/Copies d'écran) ou une résolution dynamique indépendante de
      # la locale, renseigne SCREENSHOTS_DIR dans .env (voir CONTAINER.md).
      - type: bind
        source: ${SCREENSHOTS_DIR:-${HOME}/Pictures/Screenshots}
        target: ${SCREENSHOTS_DIR:-${HOME}/Pictures/Screenshots}
        read_only: true
        # Si le chemin n'existe pas, échouer franchement au lieu de créer en
        # douce un dossier vide possédé par root.
        bind:
          create_host_path: false
      # Deploy key SSH (FACULTATIF) — clé privée DÉDIÉE au repo, montée en LECTURE
      # SEULE. Ne renseigne DEPLOY_KEY dans .env QUE si tu pousses en SSH (voir
      # CONTAINER.md) ; sinon le défaut /dev/null est monté (clé neutre) et rien
      # ne change. Mets un chemin ABSOLU (Compose n'expanse pas $HOME dans .env)
      # vers ta clé privée, p. ex. /home/toi/.ssh/blog_deploy_ed25519 (chmod 600).
      - type: bind
        source: ${DEPLOY_KEY:-/dev/null}
        target: /home/node/.ssh/deploy_key
        read_only: true
        # Comme pour les screenshots ci-dessus : si DEPLOY_KEY pointe sur un chemin
        # inexistant, échouer franchement au lieu de créer en douce un dossier vide
        # possédé par root (que ssh -i verrait comme "Is a directory"). Le défaut
        # /dev/null, lui, existe toujours → l'état neutre reste valable.
        bind:
          create_host_path: false
    environment:
      # Terminal 256 couleurs pour les shells interactifs (`docker compose exec dev
      # bash`) : sans ça, `docker exec -t` retombe sur son défaut `TERM=xterm`
      # (8 couleurs) et neovim/less/etc. n'ont pas la coloration syntaxique. Le
      # terminfo `xterm-256color` est fourni par ncurses-base (déjà dans l'image
      # Debian). Réglé sur le conteneur → hérité par tout `exec`.
      TERM: xterm-256color
      # Claude Code est épinglé dans l'image (cf. CLAUDE_CODE_VERSION du Dockerfile)
      # et se met à jour en reconstruisant l'image, pas au runtime. On coupe donc
      # l'auto-updater : il échouerait (paquet installé en root sous /usr/local,
      # conteneur lancé en `node` → "npm global folder isn't writable") et toute
      # màj écrite au runtime serait perdue à la recréation du conteneur.
      DISABLE_AUTOUPDATER: "1"
      # Token GitHub fine-grained limité au repo du blog (depuis .env, gitignoré).
      # gh le lit automatiquement ; pour git push en HTTPS, lance `gh auth setup-git`
      # une fois dans le conteneur (voir CONTAINER.md).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GITHUB_TOKEN:-}
      # Consolide TOUT l'état de Claude (config .claude.json, credentials,
      # historique projects/) dans le volume claude-config monté ci-dessus. Sans
      # ça, ~/.claude.json vit à la racine du HOME, HORS du volume, et est perdu à
      # chaque recréation du conteneur → ré-auth + historique envolé. Vérifié :
      # avec cette variable, Claude écrit .claude.json À L'INTÉRIEUR du dossier.
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Transport SSH : git utilise la deploy key montée ci-dessus. `origin` est
      # déjà en SSH (git@github.com:…) → un simple `git push` fonctionne dès que
      # DEPLOY_KEY est renseigné. IdentitiesOnly => n'essaie QUE cette clé ;
      # accept-new => mémorise l'empreinte de github.com au 1er contact sans
      # blocage interactif. Si DEPLOY_KEY n'est pas renseigné, la clé pointe sur
      # /dev/null et seul le push HTTPS (token) reste utilisable.
      GIT_SSH_COMMAND: >-
        ssh -i /home/node/.ssh/deploy_key
        -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile=/home/node/.ssh/known_hosts

volumes:
  claude-config:
