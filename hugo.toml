baseURL = "https://yanal.fargialla.com/"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false # FR reste à la racine ; l'anglais est servi sous /en/
disableKinds = ["taxonomy", "term"] # Supprimer la création des pages tag/xxx et category/yyy
enableGitInfo = true # Pour la date automatique
enableRobotsTXT = true
theme = "hugo-book"
title = "Notes Techniques" # Le nom de votre site en haut à gauche

# Site multilingue : français (langue par défaut) + anglais (traduction assistée par IA)
[languages]
  [languages.fr]
    contentDir = "content"
    languageCode = "fr-fr"
    languageName = "Français"
    title = "Notes Techniques"
    weight = 1
  [languages.en]
    contentDir = "content.en"
    languageCode = "en-us"
    languageName = "English"
    title = "Technical Notes"
    weight = 2

# Configuration spécifique au thème "Book" pour vos besoins
[params]
  BookEditPath = 'edit/main/content'
  BookRepo = 'https://github.com/Yanal-Yves/blog'
  BookSection = "*" # Permet aux titres longs de ne pas casser le design
  BookTheme = "auto" # Active le mode sombre automatique selon les préférences du visiteur
  BookToC = false # Désactive le sommaire partout
  DateFormat = "2 Jan 2006" # Format de date français

# Configuration pour que les URLs soient propres
[server]
  disableFastRender = true

# Pour que le Markdown pur soit bien interprété
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # Autorise un peu de HTML dans le markdown si besoin
    [markup.tableOfContents]
      startLevel = 2
      endLevel = 3
